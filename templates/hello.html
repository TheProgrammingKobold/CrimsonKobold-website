<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Crimson Kobold
    </title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css')}}" />
  </head>
  <body>
    <div class="landscape" id="landscape">
      <div id="container">
        <h1>
          Crimson's Cool Website! 
        </h1>
      </div>
      
      <div class="center_buttons">
        <img src="{{ url_for('static', filename='images/Blog Icon.png') }}" alt="Blog Icon" class="navicons"><a href="{{ url_for('blog')}}"><button class="navigationbuttons">Blog</button></a>
        <img src="{{ url_for('static', filename='images/Music Icon.png') }}" alt="Music Icon" class="navicons"><button class="navigationbuttons">Music</button>
        <img src="{{ url_for('static', filename='images/Coding Icon.png') }}" alt="Coding Icon" class="navicons"><button class="navigationbuttons">Coding</button>
        <img src="{{ url_for('static', filename='images/BidoofTV Icon.png') }}" alt="BidoofTV Icon" class="navicons"><button class="navigationbuttons">BidoofTV</button>
        <img src="{{ url_for('static', filename='images/MinecraftServer Icon.png') }}" alt="MinecraftServer Icon" class="navicons"><button class="navigationbuttons">Minecraft Server</button>
        <img src="{{ url_for('static', filename='images/Photos Icon.png') }}" alt="Photos Icon" class="navicons"><button class="navigationbuttons">Photos</button>
        <img src="{{ url_for('static', filename='images/Art Icon.png') }}" alt="Art Icon" class="navicons"><button class="navigationbuttons">Art</button>
      </div>
      <aside class="sidebar">
        <p>
        </p>
      </aside>
      <main>
        {% block Body %}{% endblock %}
      </main>

    </div>
  </body>
</html>
