services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - webnet

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - webnet

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: unless-stopped
    ports:
      # Replace with your webserver's LAN IP.
      - "10.1.1.11:1935:1935"
    expose:
      - "8888"

networks:
  webnet:

volumes:
  caddy_data:
  caddy_config: